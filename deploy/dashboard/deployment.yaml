apiVersion: apps/v1
kind: Deployment
metadata:
  name: zplay-dashboard
  namespace: zplay-dashboard
  labels:
    app: zplay-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zplay-dashboard
  template:
    metadata:
      labels:
        app: zplay-dashboard
    spec:
      serviceAccountName: zplay-dashboard
      containers:
        - name: dashboard
          image: ghcr.io/zyrakk/zplay-dashboard:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
