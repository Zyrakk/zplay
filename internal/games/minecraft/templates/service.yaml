apiVersion: v1
kind: Service
metadata:
  name: {{.Name}}-service
  namespace: zplay-{{.Name}}
  labels:
    app: zplay
    game: {{.Game}}
    server: {{.Name}}
spec:
  type: ClusterIP
  ports:
    - name: game
      port: 25565
      targetPort: 25565
      protocol: TCP
    - name: rcon
      port: 25575
      targetPort: 25575
      protocol: TCP
  selector:
    app: zplay
    server: {{.Name}}
