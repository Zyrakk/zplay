apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}-terraria
  namespace: zplay-{{.Name}}
  labels:
    app: zplay
    game: {{.Game}}
    server: {{.Name}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zplay
      server: {{.Name}}
  template:
    metadata:
      labels:
        app: zplay
        game: {{.Game}}
        server: {{.Name}}
    spec:
      securityContext:
        fsGroup: 3000
      {{- if .NodeSelector}}
      nodeSelector:
        kubernetes.io/hostname: {{.NodeSelector}}
      {{- end}}
      containers:
        - name: terraria
          {{- if eq .Variant "tmodloader" }}
          image: jacobsmile/tmodloader1.4:latest
          {{- else }}
          image: hexlo/terraria-server-docker:latest
          {{- end }}
          stdin: true
          tty: true
          volumeMounts:
            - name: data
              mountPath: {{ if eq .Variant "tmodloader" }}/data{{ else }}/root/.local/share/Terraria/Worlds{{ end }}
          ports:
            - name: game
              containerPort: 7777
              protocol: TCP
          env:
            {{- if eq .Variant "tmodloader" }}
            - name: TMOD_WORLDNAME
              value: "{{.Name}}"
            - name: TMOD_WORLDSIZE
              value: "{{.WorldSizeNum}}"
            - name: TMOD_DIFFICULTY
              value: "{{if .Difficulty}}{{.Difficulty}}{{else}}0{{end}}"
            - name: TMOD_MAXPLAYERS
              value: "{{.MaxPlayers}}"
            - name: TMOD_PORT
              value: "7777"
            {{- if .Password}}
            - name: TMOD_PASS
              valueFrom:
                secretKeyRef:
                  name: {{.Name}}-secret
                  key: password
            {{- end}}
            {{- if .MOTD}}
            - name: TMOD_MOTD
              value: "{{.MOTD}}"
            {{- end}}
            {{- if .Mods}}
            - name: TMOD_AUTODOWNLOAD
              value: "{{- range $i, $mod := .Mods -}}{{- if $i}},{{end -}}{{ $mod }}{{- end -}}"
            - name: TMOD_ENABLEDMODS
              value: "{{- range $i, $mod := .Mods -}}{{- if $i}},{{end -}}{{ $mod }}{{- end -}}"
            {{- end}}
            - name: TMOD_SHUTDOWN_MESSAGE
              value: "Server shutting down..."
            - name: TMOD_AUTOSAVE_INTERVAL
              value: "10"
            {{- else }}
            - name: world
              value: "/root/.local/share/Terraria/Worlds/{{.Name}}.wld"
            - name: autocreate
              value: "{{.WorldSizeNum}}"
            - name: difficulty
              value: "{{if .Difficulty}}{{.Difficulty}}{{else}}0{{end}}"
            - name: maxplayers
              value: "{{.MaxPlayers}}"
            - name: port
              value: "7777"
            {{- if .MOTD}}
            - name: motd
              value: "{{.MOTD}}"
            {{- end}}
            {{- if .Password}}
            - name: password
              valueFrom:
                secretKeyRef:
                  name: {{.Name}}-secret
                  key: password
            {{- end}}
            {{- end }}
          resources:
            requests:
              memory: {{.Memory}}
              cpu: "500m"
            limits:
              memory: {{.MemoryLimit}}
              cpu: "2"
          livenessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f 'TerrariaServer|mono|dotnet|tModLoader' || exit 1"]
            initialDelaySeconds: {{ if eq .Variant "tmodloader" }}300{{ else }}120{{ end }}
            periodSeconds: 30
            failureThreshold: {{ if eq .Variant "tmodloader" }}5{{ else }}3{{ end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pgrep -f 'TerrariaServer|mono|dotnet|tModLoader' || exit 1"]
            initialDelaySeconds: {{ if eq .Variant "tmodloader" }}180{{ else }}60{{ end }}
            periodSeconds: {{ if eq .Variant "tmodloader" }}15{{ else }}10{{ end }}
            failureThreshold: {{ if eq .Variant "tmodloader" }}5{{ else }}3{{ end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{.Name}}-pvc
